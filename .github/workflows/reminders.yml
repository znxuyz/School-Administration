# 每天早上把提醒推到老師手機上。
#
# 設定在 README〈手機提醒〉那一節,需要兩個 secret:
#   FIREBASE_SERVICE_ACCOUNT  Firebase 服務帳號的 JSON(整包貼進去)
#   VAPID_PRIVATE_KEY         tools/make-vapid.mjs 產出來的私鑰
# 和一個 variable:
#   VAPID_PUBLIC_KEY          同一組的公鑰(和 assets/push.js 裡那串一樣)
#
# ⚠️ GitHub 的排程本來就不準時,尖峰時可能延遲 5～60 分鐘。
#    「今天有哪些事」這種每日提醒沒差,但不要拿它做「十點整開會」的提醒。
name: 每日提醒

on:
  schedule:
    # 台灣早上 08:00 = UTC 00:00(台灣固定 UTC+8,沒有日光節約時間)。
    # GitHub 的 cron 一律看 UTC,要改時間記得自己減八小時 ——
    # 減完如果跨到前一天,星期幾也要跟著往前挪一天。
    - cron: "0 0 * * 1-5"     # UTC 週一～週五 00:00 = 台灣週一～週五 08:00
  # 設定好之後先用這個按鈕手動跑一次,確認收得到再等隔天
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只看會送給誰,不真的送出
        type: boolean
        default: true
      test_push:
        # 剛設定好的時候今天通常剛好沒事,這時候送出去也是零則,
        # 分不出來是「真的沒事」還是「推播根本不通」。這個選項把兩件事分開。
        description: 送一則測試通知給所有已登記的裝置(要同時取消上面的勾)
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 只有這支排程程式需要套件,網頁本身不需要任何建置
      - run: npm ci --omit=dev || npm install --omit=dev

      - run: node tools/send-reminders.mjs
        env:
          # 執行機器預設是 UTC,直接用它的日期會算錯「今天」——
          # 例如 UTC 還是週日晚上的時候,台灣已經是週一了。
          # 這個系統服務的是台灣的學校,「今天」一律以台灣時間為準。
          TZ: Asia/Taipei
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          TEST_PUSH: ${{ inputs.test_push == true && '1' || '' }}
